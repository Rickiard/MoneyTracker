services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: moneytracker-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' -b"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  redis:
    image: redis:alpine
    container_name: moneytracker-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneytracker-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      Redis__ConnectionString: ${REDIS_URL}
    networks:
      - frontend
      - backend

networks:
  frontend:
  backend: