services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: moneytracker-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=MoneyTracker@2026!
    ports:
      - "1433:1433"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneytracker-api
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=MoneyTrackerDb;User Id=sa;Password=MoneyTracker@2026!;TrustServerCertificate=true;